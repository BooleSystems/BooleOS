## nullos/tools/grub.cfg
## GRUB configuration for NullOS

set timeout=3
set default=0

insmod all_video
insmod multiboot2

menuentry "NullOS v0.10.1" {
    multiboot2 /boot/nullos.elf
    module2    /boot/ramfs.img
    boot
}

menuentry "NullOS (serial debug mode)" {
    multiboot2 /boot/nullos.elf debug
    module2    /boot/ramfs.img
    boot
}
